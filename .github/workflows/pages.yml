name: Pages

on:
  push:
    branches: [main]
    paths: [site/**, results/figures/**, docs/results-explained.pdf, scripts/export_onnx.py, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # CPU torch is enough to export the U-Net to ONNX for the in-browser demo
      - run: |
          pip install "torch==2.14.*" --index-url https://download.pytorch.org/whl/cpu
          pip install -e . onnx
      - run: bash site/build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
