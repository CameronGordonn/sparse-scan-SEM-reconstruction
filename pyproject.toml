[project]
name = "semrecon"
version = "0.1.0"
description = "Sparse-scan SEM image reconstruction: forward model, scan patterns, classical and learned reconstructions"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "pillow>=10.0",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semrecon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
